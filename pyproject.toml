[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faceless-content-cli"
version = "0.1.0"
description = "🎬 Automate faceless video creation: idea → script → voiceover → video → scheduled posts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Bonanza Labs", email = "passiveassets@proton.me"}]
keywords = ["faceless", "youtube", "tiktok", "video", "automation", "ai", "content-creation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
]
optional-dependencies.tts = ["edge-tts>=6.1"]
optional-dependencies.video = ["ffmpeg-python>=0.2"]

[project.scripts]
faceless = "faceless_content_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faceless_content_cli"]